name: i18n strings audit

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Audit i18n string coverage
        run: ruby scripts/audit-strings.rb
