name: Build and Deploy (gh-pages -> Server)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.2"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies (rendercv[full] pulled in Render CVs step)

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick git

      - name: Render CVs
        run: |
          pip install "rendercv[full]"

          # Render Chinese CV
          rendercv render _data/cv.yml
          mkdir -p assets/rendercv/rendercv_output
          mv _data/rendercv_output/*.pdf assets/rendercv/rendercv_output/zh_CN_CV.pdf
          rm -rf _data/rendercv_output

          # Render English CV
          rendercv render _data/en_US/cv_rendercv.yml
          mv _data/en_US/rendercv_output/*.pdf assets/rendercv/rendercv_output/en_US_CV.pdf
          rm -rf _data/en_US/rendercv_output

          # Render German CV
          rendercv render _data/de_DE/cv_rendercv.yml
          mv _data/de_DE/rendercv_output/*.pdf assets/rendercv/rendercv_output/de_DE_CV.pdf
          rm -rf _data/de_DE/rendercv_output

          # Render Japanese CV
          rendercv render _data/ja_JP/cv_rendercv.yml
          mv _data/ja_JP/rendercv_output/*.pdf assets/rendercv/rendercv_output/ja_JP_CV.pdf
          rm -rf _data/ja_JP/rendercv_output

          echo "All CVs rendered successfully"

      - name: Install npm (for purgecss) and Node tools
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Ruby + Python deps and build Jekyll
        run: |
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle install --jobs 4 --retry 3
          bundle exec jekyll build

      - name: Purge unused CSS (optional)
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js || true

      - name: Publish built site to gh-pages branch
        # 迁移自 peaceiris/actions-gh-pages@v3（2024 archived，Node 16 runtime 已被 GitHub 弃用）。
        # JamesIves/github-pages-deploy-action@v4（runtime node24，积极维护）。
        # gh-pages 在本仓库是纯中转分支：服务器侧 git fetch --depth=1 + checkout 文件树，
        # 不依赖 git 历史，故 JamesIves 默认 force:true/clean:true 与原 peaceiris 行为等价、无风险。
        # v4 major tag 跟踪 v4.8.0（commit d92aa235），与项目现有 @vN pin 风格一致。
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./_site
          branch: gh-pages
          commit-message: "Deploy: ${{ github.sha }} via build-and-deploy workflow"

      - name: Deploy on remote server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            echo "Starting server deploy..."

            # Customize paths below for your server environment
            # Example paths from sample (adapt as needed):
            REMOTE_SITE_ROOT=/opt/1panel/apps/openresty/openresty/www/sites/lab.wenjiexu.site
            REMOTE_INDEX_DIR=$REMOTE_SITE_ROOT/index
            REMOTE_WORK_DIR=$REMOTE_SITE_ROOT/LabPage

            # Ensure work dir exists
            mkdir -p $REMOTE_WORK_DIR
            cd $REMOTE_WORK_DIR

            # If you want to use a Git proxy mirror, set the remote accordingly;
            # otherwise remove the next line.
            git remote set-url origin https://gh.xmly.dev/https://github.com/Vncntvx/LabPage || true

            # Git safe directory config
            git config --global --add safe.directory "$(pwd)" || true

            # Fetch the latest gh-pages branch from origin and checkout into index
            git fetch origin gh-pages --depth=1 || true

            rm -rf $REMOTE_INDEX_DIR/* || true
            git --work-tree=$REMOTE_INDEX_DIR checkout origin/gh-pages -- . || true

            # Set index files permission if needed (PHP-FPM uid/gid=1000:1000 in example)
            chown -R 1000:1000 $REMOTE_INDEX_DIR || true

            echo "✅ Deployed latest gh-pages content to server: $REMOTE_INDEX_DIR"
