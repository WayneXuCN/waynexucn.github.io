name: Publish posts scheduled for today

# This workflow has been disabled and moved from schedule-posts.yml to
# schedule-posts.disabled.yml because the _scheduled/ collection is empty
# (no scheduled drafts exist yet). The daily cron run was failing every
# day on `git add _scheduled/` with "pathspec did not match any files",
# since the directory does not exist in the repo, which triggered daily
# failure notifications. To re-enable, rename this file back to
# schedule-posts.yml once you actually start scheduling posts.
on:
  schedule:
    # Run every day at 23:30 UTC or manually run
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Get the date for today
        id: date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Check for scheduled posts and move to posts
        run: |
          echo "Today is $TODAY"
          shopt -s nullglob
          for file in _scheduled/**/${TODAY}-*.md; do
            echo "Found scheduled: $file"
            parent_dir="$(dirname "$file")"
            language_dir="$(basename "$parent_dir")"
            mkdir -p "_posts/$language_dir"
            mv "$file" "_posts/$language_dir/"
            echo "Moved $file to _posts/$language_dir/"
          done
          # Guard: if neither _posts/ nor _scheduled/ exists on disk,
          # skip the git add steps to avoid exit code 128.
          if [ ! -d _posts ] && [ ! -d _scheduled ]; then
            echo "No _posts or _scheduled directory present; nothing to do."
            exit 0
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _posts/ 2>/dev/null || true
          git add _scheduled/ 2>/dev/null || true
          git commit -m "Posted Scheduled Drafts on $TODAY" || echo "No changes to commit"
          git push
